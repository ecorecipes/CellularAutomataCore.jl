# Renders the quarto vignettes with the Julia engine to HTML, GitHub-flavoured
# Markdown and PDF. Manual + weekly; not a required check (see CONTRIBUTING.md).
name: Vignettes
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: CellularAutomataCore.jl
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
        with:
          cache-compiled: 'true'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - name: Install PDF prerequisites
        # librsvg2-bin provides rsvg-convert, which quarto uses to embed SVG
        # figures in the PDF. stix2-otf supplies the STIX Two
        # text/math fonts; the remaining packages are used by the quarto template.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          # TinyTeX (installed by quarto-actions/setup) is not on PATH by default.
          tl=$(dirname "$(ls -d "$HOME"/.TinyTeX/bin/*/tlmgr | head -1)")
          echo "$tl" >> "$GITHUB_PATH"
          # TinyTeX's repository moves ahead of the bundled tlmgr, which then refuses to
          # install anything until it has updated itself.
          "$tl/tlmgr" update --self
          "$tl/tlmgr" install stix2-otf koma-script fvextra
      - name: Fetch JuliaMono
        # The PDF format uses JuliaMono (SIL OFL) as the monospace font, looked up
        # via fontspec at ../../fonts/JuliaMono/ relative to vignettes/ (see
        # vignettes/_quarto.yml), i.e. $GITHUB_WORKSPACE/fonts/JuliaMono/ here.
        run: |
          mkdir -p fonts/JuliaMono
          curl -sSL https://github.com/cormullion/juliamono/releases/latest/download/JuliaMono-ttf.tar.gz | tar -xz -C fonts/JuliaMono
      - name: Instantiate vignette environment
        run: julia --project=CellularAutomataCore.jl/vignettes -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - uses: actions/cache/restore@v4
        with:
          # entries are named by what they depend on, so an old one can be reused safely
          path: CellularAutomataCore.jl/vignettes/_exec_cache
          key: vignette-exec-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vignette-exec-${{ runner.os }}-
      - name: Render (html, gfm, pdf)
        working-directory: CellularAutomataCore.jl
        run: julia scripts/render_vignettes.jl
      - uses: actions/cache/save@v4
        # also after a failure: the script carries on past a failing vignette, and the
        # others need not run again
        if: always()
        with:
          path: CellularAutomataCore.jl/vignettes/_exec_cache
          key: vignette-exec-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report drift from the committed renders
        # Informational: a fresh render on this runner differs from the committed one in
        # timings, the last digits of some floats (x86 here, the renders are made locally)
        # and sections gated on local data. The per-push CI job checks that the committed
        # renders and docs/src/tutorials agree; this step only lists what drifted.
        working-directory: CellularAutomataCore.jl
        run: julia scripts/sync_vignettes.jl --check || echo "::notice::fresh renders differ from the committed ones (see the list above)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vignettes
          path: |
            CellularAutomataCore.jl/vignettes/*/*.md
            CellularAutomataCore.jl/vignettes/*/*.html
            CellularAutomataCore.jl/vignettes/*/*.pdf
            CellularAutomataCore.jl/vignettes/*/*_files
